<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      .no-image-text {
        font-family: 'Fredoka', 'Nunito', sans-serif;
        font-weight: 700;
        fill: #888888;
        font-size: 26px;
        letter-spacing: 4px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Fondo sutil acorde a la estética -->
  <rect width="400" height="300" rx="16" fill="#f0f0f0" stroke="#cccccc" stroke-width="4" />

  <!-- Icono minimalista de imagen tachada / omitida en verde Wii -->
  <g transform="translate(168, 95)" fill="none" stroke="#4bb36b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="64" height="48" rx="6" />
    <circle cx="20" cy="18" r="6" />
    <path d="M4 44 L24 24 L36 36 L44 28 L60 44" />
  </g>

  <!-- Texto minimalista -->
  <text x="200" y="195" class="no-image-text">NO IMAGE</text>
</svg>